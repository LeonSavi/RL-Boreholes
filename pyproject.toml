[tool.poetry]
name = "rl-boreholes-ocr"
version = "0.1.0"
description = "Tesseract OCR pipeline for Dutch NLOG borehole PDF reports"
authors = ["Dennis Vriend <dennis.vriend1@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python                 = ">=3.10,<3.13"
pytesseract            = ">=0.3.10"
pdf2image              = ">=1.17.0"
Pillow                 = ">=10.0.0"
opencv-python-headless = ">=4.8.0"
pandas                 = ">=2.0.0"
pyarrow                = ">=14.0.0"
numpy                  = ">=1.24.0"
tqdm                   = ">=4.65.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
